worker_processes 1;
events { worker_connections 256; }
http {
  ssl_certificate /etc/nginx/ssl/server.crt;
  ssl_certificate_key /etc/nginx/ssl/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # SmartReview Web App on port 80 & 443
  server {
    listen 80;
    listen 443 ssl;
    server_name mixi-t028.cloud www.mixi-t028.cloud _;
    client_max_body_size 1g;

    location / {
      proxy_pass http://127.0.0.1:3100;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
      proxy_read_timeout 120s;
    }
  }

  # CVAT via subdomain on port 80 & 443 (e.g. cvat.mixi-t028.cloud)
  server {
    listen 80;
    listen 443 ssl;
    server_name cvat.mixi-t028.cloud cvat.*;
    client_max_body_size 1g;

    location = /smartreview-panel.js {
      alias /usr/share/smartreview/panel.js;
      default_type application/javascript;
      add_header Cache-Control "no-store";
    }
    location /smartreview/api/ {
      proxy_pass http://127.0.0.1:3100/api/;
      proxy_set_header Host 127.0.0.1:3100;
      proxy_set_header Origin http://127.0.0.1:3100;
      proxy_cookie_path /api /smartreview/api;
      proxy_read_timeout 900s; # a 2D scan runs YOLO on every frame of the job before it answers
    }
    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
      proxy_set_header Accept-Encoding "";
      sub_filter '</body>' '<script src="/smartreview-panel.js" defer></script></body>';
      sub_filter_once on;
    }
  }

  # CVAT behind this proxy at :8081. SmartReview's panel script is injected into CVAT's HTML,
  # and SmartReview's API is exposed on the same origin under /smartreview/api/, so the panel
  # needs no CORS and no token in the page; it signs in with the SmartReview session cookie.
  server {
    listen 8081;
    server_name _;
    client_max_body_size 1g;

    location = /smartreview-panel.js {
      alias /usr/share/smartreview/panel.js;
      default_type application/javascript;
      add_header Cache-Control "no-store";
    }
    location /smartreview/api/ {
      proxy_pass http://127.0.0.1:3100/api/;
      proxy_set_header Host 127.0.0.1:3100;
      proxy_set_header Origin http://127.0.0.1:3100;
      proxy_cookie_path /api /smartreview/api;
      proxy_read_timeout 900s; # a 2D scan runs YOLO on every frame of the job before it answers
    }
    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
      proxy_set_header Accept-Encoding "";
      sub_filter '</body>' '<script src="/smartreview-panel.js" defer></script></body>';
      sub_filter_once on;
    }
  }
}
